<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Offene Lernumgebung Chemie Q2: räumliche Orientierung bei radikalischen Substitutionen">
<title>Lernweltkarte Bromierung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: Die Karte ist das Energiediagramm der Bromierung als Gelände. Die Stationen liegen auf Weg 2, die Benennung
   der Wege erscheint erst nach Station 2. Rechts Leitfrage, Fortschritt und Werkzeuge. Eine Station öffnet sich als
   Bogen über der Karte: links Material, rechts Aufgaben. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#16231D; --muted:#55645C; --line:#C9D4CE;
  --route:#4B7A26; --route-ink:#FFFFFF; --ozone:#1D8C85; --ozone-tint:#CFEAE6; --uv:#6A44B5; --sun:#D99A00;
  --sky-hi:#D6DDF0; --sky-lo:#EEF4F2; --trop:#E8F0EC; --ground:#C3CFB8; --ground-ink:#7C8B70; --ridge:#D3E0C2; --ridge-back:#E2E7E3;
  --ok:#2B7A44; --ok-tint:#E0F1E5; --bad:#B3412A; --bad-tint:#F8E3DD; --hint:#7D5B00; --hint-tint:#FFF3D1;
  --raddot:#C4492C; --plate:#FFFFFF; --scrim:rgba(16,24,20,.48);
  --atom-o:#D2462E; --atom-cl:#3E9B4F; --atom-n:#3567C4; --atom-f:#C9A227; --atom-c:#4A4F4C;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1416; --surface:#162024; --surface-2:#1C282C; --ink:#E3ECE7; --muted:#9BAEA5; --line:#2C3B38;
    --route:#8CC15A; --route-ink:#0E1416; --ozone:#4CC2B8; --ozone-tint:#123634; --uv:#B497F2; --sun:#F2C24F;
    --sky-hi:#121A31; --sky-lo:#18262E; --trop:#1A2A2C; --ground:#2B3727; --ground-ink:#71806A; --ridge:#26382A; --ridge-back:#1E2C2F;
    --ok:#6FC78C; --ok-tint:#15301F; --bad:#F08C73; --bad-tint:#3A1D17; --hint:#F2C94C; --hint-tint:#30270E;
    --raddot:#F08C73; --plate:#F6F8F7; --scrim:rgba(0,0,0,.62);
    --atom-o:#F0745C; --atom-cl:#6CCB7C; --atom-n:#7FA6F2; --atom-f:#E8C55A; --atom-c:#B9C2BD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#162024; --surface-2:#1C282C; --ink:#E3ECE7; --muted:#9BAEA5; --line:#2C3B38;
  --route:#8CC15A; --route-ink:#0E1416; --ozone:#4CC2B8; --ozone-tint:#123634; --uv:#B497F2; --sun:#F2C24F;
  --sky-hi:#121A31; --sky-lo:#18262E; --trop:#1A2A2C; --ground:#2B3727; --ground-ink:#71806A; --ridge:#26382A; --ridge-back:#1E2C2F;
  --ok:#6FC78C; --ok-tint:#15301F; --bad:#F08C73; --bad-tint:#3A1D17; --hint:#F2C94C; --hint-tint:#30270E;
  --raddot:#F08C73; --plate:#F6F8F7; --scrim:rgba(0,0,0,.62);
  --atom-o:#F0745C; --atom-cl:#6CCB7C; --atom-n:#7FA6F2; --atom-f:#E8C55A; --atom-c:#B9C2BD;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
sub,sup{font-size:.68em;line-height:0}
.rad{font-weight:800;color:var(--raddot);padding:0 .03em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;text-align:center}
.btn.primary{background:var(--route);border-color:var(--route);color:var(--route-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.role-chip{font-size:13px;color:var(--muted);align-self:center}
.role-chip b{color:var(--ink)}

/* Welt */
.world{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,390px);gap:20px;padding:16px;max-width:1280px;margin:0 auto;align-items:start}
.mapwrap{display:flex;justify-content:center;min-width:0}
.map{position:relative;width:min(100%,calc((100vh - 112px)*.8));aspect-ratio:4/5;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sky-lo);max-width:100%}
@supports (height:100dvh){.map{width:min(100%,calc((100dvh - 112px)*.8))}}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.svg-lab{font-family:var(--f-body);font-weight:700;letter-spacing:.06em;fill:var(--ink)}
.svg-sub{font-family:var(--f-body);fill:var(--muted)}
.svg-num{font-family:var(--f-num);fill:var(--muted)}

.stn{position:absolute;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
.stn.below{flex-direction:column;transform:translate(-50%,-21px)}
.stn.right{flex-direction:row;transform:translate(-21px,-50%)}
.stn.left{flex-direction:row-reverse;transform:translate(calc(-100% + 21px),-50%)}
.stn.left .lab{text-align:right}
.dot{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--route);color:var(--route-ink);font-family:var(--f-display);font-weight:800;font-size:20px;box-shadow:0 0 0 4px var(--surface),0 3px 8px rgba(0,0,0,.25)}
.dot svg{width:22px;height:22px}
.dot.diamond{border-radius:7px;transform:rotate(45deg);width:36px;height:36px;margin:3px}
.dot.diamond>*{transform:rotate(-45deg)}
.stn.locked .dot{background:var(--surface-2);color:var(--muted);box-shadow:0 0 0 4px var(--surface),inset 0 0 0 2px var(--line)}
.stn.done .dot{background:var(--surface);color:var(--route);box-shadow:0 0 0 4px var(--route),0 3px 8px rgba(0,0,0,.2)}
.stn .tick{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--surface);display:none;place-items:center}
.dot.diamond .tick{right:auto;left:-10px;top:-10px}
.stn.done .tick{display:grid}
.stn .tick svg{width:12px;height:12px}
.stn.next .dot{animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px var(--sun)}70%{box-shadow:0 0 0 4px var(--surface),0 0 0 16px transparent}100%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px transparent}}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13.5px;font-weight:700;line-height:1.25;white-space:nowrap;text-align:left;color:var(--ink)}
.stn.below .lab{text-align:center}
.lab small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.profi{position:absolute;left:68.5%;top:4.5%;width:29%;border:2px dashed var(--muted);border-radius:12px;background:var(--surface);padding:7px 8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.profi .eyebrow{font-size:11px}
.pbtn{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:13.5px;text-align:left}
.pbtn .star{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--sun);color:var(--ink);font-family:var(--f-display);font-size:14px}
.pbtn.done{border-color:var(--ok)}
.pbtn.done .star{background:var(--ok);color:var(--surface)}
.profi-side{display:none;flex-direction:column;gap:8px}
.token{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:2px 8px;border-radius:99px;background:var(--ink);color:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none;transition:left 1.1s cubic-bezier(.4,.1,.2,1),top 1.1s cubic-bezier(.4,.1,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.token .rad{color:var(--sun)}

/* Seitenleiste */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.leit{border-left:6px solid var(--ozone)}
.leit p{margin:6px 0 0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-head b{font-family:var(--f-display);font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--route);border-radius:99px;transition:width .6s}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:6px 6px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.steps button:hover{background:var(--surface-2)}
.mini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.mini.done{background:var(--route);color:var(--route-ink)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.now{background:var(--hint-tint);color:var(--hint)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.next-btn{width:100%;min-height:52px;font-size:16px}

/* Bogen (Station) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.sh-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.sh-title h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1}
.sh-title .dot{width:40px;height:40px;font-size:18px;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.sheet-body{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.sheet-body.single{grid-template-columns:minmax(0,1fr);max-width:820px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col>h3{margin:4px 0 0;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mat h4{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.mat h4 .tag{font-family:var(--f-display);font-weight:800;color:var(--ozone)}
.mat p{margin:0 0 8px}
.mat p:last-child{margin-bottom:0}
.mat ol,.mat ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-size:13px}
.tbl td.num{font-family:var(--f-num);white-space:nowrap}
.tblwrap{overflow-x:auto}
.formel{font-size:18px;padding:8px 12px;background:var(--surface-2);border-radius:8px;display:inline-block}
.plate{background:var(--plate);border-radius:10px;padding:10px;border:1px solid var(--line)}
.plate img{display:block;width:100%;height:auto}
.cap{font-size:13px;color:var(--muted);margin-top:6px}
.sheet-foot{max-width:1200px;margin:0 auto;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap}
.sheet-foot p{margin:0;color:var(--muted);font-size:14px}
.sheet-foot .check{flex:1 1 320px;max-width:560px;background:var(--hint-tint);border-color:var(--hint)}
.sheet-foot .check[aria-pressed="true"]{background:var(--ok-tint);border-color:var(--ok)}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.seg button{flex:1 1 150px;min-height:44px;border:0;border-radius:8px;background:none;cursor:pointer;font-weight:700;font-size:14.5px;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--route);color:var(--route-ink)}
.lock{display:flex;gap:12px;align-items:center}

/* Aufgaben */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.task.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tnum{font-family:var(--f-display);font-weight:800;color:var(--route);font-size:15px}
.prompt{font-weight:700;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);min-height:46px;cursor:pointer;font-size:15.5px}
.opt .box{flex:none;width:20px;height:20px;margin-top:1px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--route)}
.opt[aria-pressed="true"] .box{background:var(--route);border-color:var(--route)}
.opt[aria-pressed="true"] .box::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--route-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-tint)}
.fb.bad{background:var(--bad-tint)}
.tip{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--hint-tint);border-left:4px solid var(--hint);font-size:15px}
.tip b{color:var(--hint)}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:20px;padding:12px;background:var(--surface-2);border-radius:10px}
.slot{min-width:86px;min-height:48px;border:2px dashed var(--muted);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:4px 12px;background:var(--surface);cursor:pointer;font-size:20px}
.slot.filled{border-style:solid;border-color:var(--route)}
.slot.right{border-color:var(--ok);background:var(--ok-tint)}
.slot.wrong{border-color:var(--bad);background:var(--bad-tint)}
.arr{display:inline-flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);line-height:1}
.arr svg{width:58px;height:12px;color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{min-height:46px;min-width:56px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:19px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tile:disabled{opacity:.3;cursor:default;box-shadow:none}
.seq{display:flex;flex-direction:column;gap:6px}
.seq .slot{justify-content:flex-start;width:100%;font-size:15.5px;text-align:left;gap:10px;min-height:46px}
.seq .slot .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.seq-pool{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.seq-pool .tile{font-size:15.5px;text-align:left;width:100%}
.num-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px}
.num-in input{width:130px;min-height:48px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-num);font-size:20px}
.ta{width:100%;min-height:150px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px;line-height:1.5;resize:vertical}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chiprow .lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:100%}
.wchip{min-height:38px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:14.5px}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;min-height:44px;font-size:15px}
.check .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-tint)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check .box svg{width:13px;height:13px;display:none}
.check[aria-pressed="true"] .box svg{display:block}
.thesen{display:flex;flex-direction:column;gap:10px}
.these{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.these .tw{display:flex;gap:6px}
.yn{min-height:44px;padding:4px 12px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px}
.yn[aria-pressed="true"]{border-color:var(--route);background:var(--route);color:var(--route-ink)}
.cmp td .mk{font-weight:800}
.ekarte{border:2px solid var(--ozone);border-radius:12px;padding:12px 14px;background:var(--surface)}
.ekarte h4{margin:0 0 6px;color:var(--ozone);font-family:var(--f-display);font-weight:800}
.ekarte ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;min-height:44px}
.role b{font-size:15px}
.role span{font-size:13px;color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--route)}
.pairpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairpick button{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.pairpick button b{font-family:var(--f-display);font-size:19px}
.pairpick button span{color:var(--muted);font-size:14px}
.pairpick button[aria-pressed="true"]{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}

/* Simulation */
.sim{display:flex;flex-direction:column;gap:8px}
.sim canvas{width:100%;height:auto;aspect-ratio:2/1;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:block}
.sim-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.counter{font-family:var(--f-num);font-weight:700;font-size:14px;margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sim-msg{font-size:14.5px;padding:8px 10px;border-radius:9px;background:var(--hint-tint)}

/* Formeln zum Antippen */
.hmol{display:block;width:100%;height:auto;max-width:620px;margin:2px auto 0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hmol .bd,.alk .bd{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.hmol text,.alk text{font-family:var(--f-body);font-weight:700;font-size:25px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.hmol .cn{font-size:15px;font-weight:400;fill:var(--muted)}
.hb{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hb:focus{outline:none}
.hb .hit{fill:transparent}
.hb .ring{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.hb:focus-visible .ring{stroke:var(--sun);stroke-width:3}
.hb[aria-pressed="true"] .ring{fill:var(--route);stroke:var(--route)}
.hb[aria-pressed="true"] text{fill:var(--route-ink)}
.hb.right .ring{fill:var(--ok-tint);stroke:var(--ok)}
.hb.right text{fill:var(--ok)}
.hb.wrong .ring{fill:var(--bad-tint);stroke:var(--bad)}
.hb.wrong text{fill:var(--bad)}

/* Alkylgruppen-Schalter und Energiediagramm */
.alk{display:flex;flex-direction:column;gap:10px}
.alk svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.alk .halo{fill:var(--raddot);opacity:.2;transition:r .3s}
.alk .edot{fill:var(--raddot)}
.alk .ie{stroke:var(--ozone);stroke-width:3;stroke-linecap:round}
.alk .seg button{flex:1 1 64px;padding:6px 4px}
.alk-name{margin:0;text-align:center}
.gauge{display:grid;grid-template-columns:auto minmax(90px,1fr);gap:6px 10px;align-items:center;font-size:14px}
.gauge .b{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.gauge .b i{display:block;height:100%;background:var(--raddot);transition:width .3s}
.gauge .b.st i{background:var(--route)}
.plate-svg{background:var(--surface-2);border-radius:10px;padding:8px}
.dia{display:block;width:100%;height:auto}
.dia text{font-family:var(--f-body);font-size:14px;fill:var(--ink)}
.dia .m{fill:var(--muted)}
.dia .rt{fill:var(--raddot);font-weight:800}
.kette{list-style:none;margin:6px 0 0;padding:0;counter-reset:k;display:flex;flex-direction:column;gap:6px}
.kette li{counter-increment:k;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.kette li::before{content:counter(k);flex:none;width:24px;height:24px;border-radius:50%;background:var(--route);color:var(--route-ink);display:grid;place-items:center;font-weight:800;font-size:13px}

/* Überlagerung */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pop{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.pop-card{width:100%;max-width:640px;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:18px 18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pop-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px}
.treppe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.treppe li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.treppe li b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--route);color:var(--route-ink);display:grid;place-items:center;font-family:var(--f-display)}
.gloss{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 14px;margin:0}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--ink)}
.res-sec{margin-top:14px}
.res-sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.answer{white-space:pre-wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.danger{border-color:var(--bad);color:var(--bad)}

@media (max-width:900px){
  .world{grid-template-columns:minmax(0,1fr)}
  .map{width:100%}
  .sheet-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .dot{width:34px;height:34px;font-size:16px}
  .dot.diamond{width:28px;height:28px}
  .stn.below{transform:translate(-50%,-17px)}
  .stn.right{transform:translate(-17px,-50%)}
  .stn.left{transform:translate(calc(-100% + 17px),-50%)}
  .lab{font-size:11.5px;padding:2px 6px}
  .lab small{font-size:10.5px}
  .lab small{display:none}
  .profi{display:none}
  .profi-side{display:flex}
  .roles,.pairpick{grid-template-columns:1fr}
  .these{grid-template-columns:1fr}
  .eq{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .stn.next .dot{animation:none;box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--sun)}
  .token,.bar i,.gauge .b i{transition:none}
}
</style>
</head>

/* ---------- Fortschritt ---------- */
function T(id){ return S.tasks[id] || (S.tasks[id] = {}); }
function okAll(ids){ return ids.every(function(id){ return S.tasks[id] && S.tasks[id].ok; }); }
var A_IDS = ['A1','A2','A3'], B_IDS = ['B1','B2','B3','B4'];
function ownIds(){ return S.paar === 'B' ? B_IDS : A_IDS; }
function quizIds(){ return S.paar === 'B' ? ['QA1','QA2'] : ['QB1','QB2']; }
function ready(id){
  switch (id) {
    case 'start': return THESEN.every(function(t){ return S.vor[t.id]; });
    case 's2': return !!S.paar && okAll(ownIds()) && okAll(quizIds());
    case 's3': return leitOk() && okAll(s3Ids());
    case 'ziel': return THESEN.every(function(t){ return S.nach[t.id]; });
    default: return okAll(ST[id].tasks);
  }
}
function leitOk(){ return (S.text.leit || '').trim().length >= 60 && Object.keys(S.krit).some(function(k){ return S.krit[k]; }); }
function locked(id){ return false; }
function nextId(){ for (var i = 0; i < ORDER.length; i++) { var id = ORDER[i]; if (!S.done[id] && !locked(id)) return id; } return null; }

/* ---------- Karte ---------- */
var elStations = document.getElementById('stations');
function badge(st){
  var inner = st.icon ? ICON[st.icon] : '<span>' + st.nr + '</span>';
  return '<span class="dot' + (st.diamond ? ' diamond' : '') + '">' + inner + '<span class="tick">' + ICON.check + '</span></span>';
}
function renderMap(){
  var nx = nextId();
  elStations.innerHTML = ORDER.map(function(id){
    var p = POS[id], st = ST[id];
    var cls = 'stn ' + p[2] + (S.done[id] ? ' done' : '') + (locked(id) ? ' locked' : '') +
      (id === nx ? ' next' : '');
    return '<button type="button" class="' + cls + '" style="left:' + p[0] + '%;top:' + p[1] + '%" data-open="' + id + '" aria-label="' + esc(st.title + (S.done[id] ? ', erledigt' : '')) + '">' +
      badge(st) + '<span class="lab">' + p[3] + '<small>' + p[4] + '</small></span></button>';
  }).join('');
  document.querySelectorAll('.pbtn').forEach(function(b){ b.classList.toggle('done', !!S.done[b.dataset.open]); });
  // Benennung der Wege und Aktivierungsenergien nach Station 2
  var sec = !!S.done.s2;
  document.getElementById('lg1').textContent = sec ? 'Weg 1: primäres Radikal' : 'Weg 1';
  document.getElementById('lg2').textContent = sec ? 'Weg 2: sekundäres Radikal' : 'Weg 2';
  var ea = document.getElementById('eaGroup'); if (sec) ea.removeAttribute('hidden'); else ea.setAttribute('hidden', '');
  // Teilchen auf dem Weg
  var last = 'start';
  ORDER.forEach(function(id){ if (S.done[id]) last = id; });
  var p = POS[last], tok = document.getElementById('token');
  tok.innerHTML = S.done.s3 ? '2-Brompropan' : (S.done.s2 ? fm('C_3H_7·') : fm('Br·'));
  tok.style.left = (p[0] + (p[2] === 'below' ? 0 : -1)) + '%';
  tok.style.top = (p[1] - 6.2) + '%';
  // Seitenleiste
  document.getElementById('leitText').textContent = LEIT;
  var n = ORDER.filter(function(id){ return S.done[id]; }).length;
  document.getElementById('progCount').textContent = n + ' von ' + ORDER.length;
  document.getElementById('progBar').style.width = (n / ORDER.length * 100) + '%';
  document.getElementById('steps').innerHTML = ORDER.map(function(id){
    var st = ST[id], pill;
    if (S.done[id]) pill = '<span class="pill ok">erledigt</span>';
    else if (locked(id)) pill = '<span class="pill">nach Station 2</span>';
    else if (id === nx) pill = '<span class="pill now">jetzt</span>';
    else pill = '<span class="pill">offen</span>';
    var mini = st.icon === 'flag' ? 'Z' : (st.icon === 'camp' ? 'S' : st.nr);
    return '<li><button type="button" data-open="' + id + '"><span class="mini' + (S.done[id] ? ' done' : '') + '">' + mini + '</span><span>' + st.title + '</span>' + pill + '</button></li>';
  }).join('');
  var nb = document.getElementById('nextBtn');
  if (nx) { delete nb.dataset.pop; nb.dataset.open = nx; nb.textContent = (n === 0 ? 'Start: ' : 'Weiter: ') + ST[nx].title; }
  else {
    var pn = !S.done.p1 ? 'p1' : '';
    delete nb.dataset.open; delete nb.dataset.pop;
    if (pn) { nb.dataset.open = pn; nb.textContent = 'Geschafft! Weiter zur Profi-Station'; }
    else { nb.dataset.pop = 'ergebnisse'; nb.textContent = 'Alles geschafft: Meine Ergebnisse'; }
  }
  var rc = document.getElementById('roleChip');
  if (S.rolle) { rc.hidden = false; rc.innerHTML = 'Deine Rolle: <b>' + esc(S.rolle) + '</b>'; } else rc.hidden = true;
}

/* ---------- Aufgaben ---------- */
function shuffled(t){ return t.shuffle || t.tiles.map(function(_, i){ return i; }); }
function taskCard(id, label){
  var t = TASKS[id], s = T(id), body = '';
  if (t.type === 'single' || t.type === 'multi') {
    var sel = s.val || [];
    body = '<div class="opts">' + t.options.map(function(o, i){
      var on = sel.indexOf(i) >= 0, mark = '';
      if (s.checked && on) mark = o.ok ? ' right' : ' wrong';
      return '<button type="button" class="opt' + (t.type === 'single' ? ' radio' : '') + mark + '" aria-pressed="' + on + '" data-a="pick" data-i="' + i + '"><span class="box"></span><span>' + fm(o.t) + '</span></button>';
    }).join('') + '</div>';
  } else if (t.type === 'order') {
    var seq = s.val || [];
    body = '<div class="seq">' + t.items.map(function(_, k){
      var it = seq[k], mark = '';
      if (s.checked && it !== undefined) mark = it === k ? ' right' : ' wrong';
      return '<button type="button" class="slot' + (it !== undefined ? ' filled' : '') + mark + '" data-a="unslot" data-k="' + k + '"><span class="n">' + (k + 1) + '</span><span>' + (it !== undefined ? fm(t.items[it]) : '<span style="color:var(--muted)">antippen, um eine Karte hierher zu legen</span>') + '</span></button>';
    }).join('') + '</div>' + (s.ok ? '' : '<div class="seq-pool">' + t.shuffle.map(function(i){
      return '<button type="button" class="tile" data-a="seq" data-i="' + i + '"' + (seq.indexOf(i) >= 0 ? ' disabled' : '') + '>' + fm(t.items[i]) + '</button>';
    }).join('') + '</div>');
  } else if (t.type === 'build') {
    var v = s.val || [];
    var slots = [];
    for (var k = 0; k < t.slots; k++) {
      var ti = v[k], mk = '';
      if (s.checked && ti !== undefined && ti !== null) mk = t.correct.indexOf(t.tiles[ti]) >= 0 ? ' right' : ' wrong';
      slots.push('<button type="button" class="slot' + (ti != null ? ' filled' : '') + mk + '" data-a="unslot" data-k="' + k + '" aria-label="Platz ' + (k + 1) + '">' + (ti != null ? fm(t.tiles[ti]) : '?') + '</button>');
    }
    body = '<div class="eq">' + t.lhs.map(function(x){ return '<span>' + fm(x) + '</span>'; }).join(' <span>+</span> ') + ' ' + arrow(t.arrow) + ' ' + slots.join(' <span>+</span> ') + '</div>' +
      (s.ok ? '' : '<div class="tiles">' + t.tiles.map(function(x, i){ return '<button type="button" class="tile" data-a="tile" data-i="' + i + '"' + (v.indexOf(i) >= 0 ? ' disabled' : '') + '>' + fm(x) + '</button>'; }).join('') + '</div>');
  } else if (t.type === 'number') {
    body = '<div class="num-in"><span>' + t.pre + '</span><input id="in-' + id + '" type="text" inputmode="decimal" autocomplete="off" value="' + esc(s.val || '') + '" aria-label="' + esc(t.pre.replace(' =', '')) + '"><span>' + t.unit + '</span></div>' +
      (t.cap ? '<p class="cap">' + t.cap + '</p>' : '');
  } else if (t.type === 'htap') {
    body = molHTML(id, t, s);
  }
  var tipN = S.tips[id] || 0, tips = '';
  for (var j = 0; j < tipN; j++) tips += '<div class="tip"><b>Tipp ' + (j + 1) + ':</b> ' + fm(t.tips[j]) + '</div>';
  var fb = '';
  if (s.ok) {
    fb = '<div class="fb ok">' + fm(t.ok) + '</div>';
    if (t.reveal) fb += '<div class="plate" style="margin-top:10px"><img src="' + t.reveal[0] + '" alt="' + esc(t.reveal[1]) + '"></div><p class="cap">' + esc(t.reveal[1]) + '</p>';
  } else if (s.fb) fb = '<div class="fb bad">' + fm(s.fb) + '</div>';
  var actions = s.ok ? '' : '<div class="actions"><button type="button" class="btn primary small" data-a="check">Prüfen</button>' +
    '<button type="button" class="btn small" data-a="tip"' + (tipN >= t.tips.length ? ' disabled' : '') + '>' + (tipN === 0 ? 'Tipp 1' : 'Tipp 2') + '</button></div>';
  return '<article class="task' + (s.ok ? ' ok' : '') + '" data-task="' + id + '"><div class="task-head"><span class="tnum">' + label + '</span>' +
    (s.ok ? '<span class="pill ok">gelöst</span>' : '<span class="pill">offen</span>') + '</div><p class="prompt">' + fm(t.prompt) + '</p>' + body + tips + fb + actions + '</article>';
}

function checkTask(id){
  var t = TASKS[id], s = T(id), v = s.val, ok = false, msg = '';
  s.checked = true;
  if (t.type === 'single' || t.type === 'multi') {
    v = v || [];
    var want = t.options.map(function(o, i){ return o.ok ? i : -1; }).filter(function(i){ return i >= 0; });
    ok = v.length === want.length && want.every(function(i){ return v.indexOf(i) >= 0; });
    if (!ok) {
      var wrong = v.filter(function(i){ return !t.options[i].ok; });
      if (!v.length) msg = 'Wähle zuerst eine Antwort aus.';
      else if (wrong.length) msg = wrong.map(function(i){ return t.options[i].fb; }).join(' ');
      else msg = 'Das stimmt schon, aber es fehlt noch ein Grund.';
    }
  } else if (t.type === 'order') {
    v = v || [];
    ok = v.length === t.items.length && v.every(function(x, k){ return x === k; });
    if (!ok) msg = v.length < t.items.length ? 'Lege zuerst alle Karten.' : 'Die rot markierten Karten liegen noch falsch. Tippe sie an, um sie zurückzulegen.';
  } else if (t.type === 'build') {
    v = (v || []).filter(function(x){ return x != null; });
    var got = v.map(function(i){ return t.tiles[i]; });
    if (got.length < t.slots) msg = 'Fülle zuerst alle Plätze.';
    else {
      var bad = got.filter(function(g){ return t.correct.indexOf(g) < 0; });
      ok = !bad.length && t.correct.every(function(c){ return got.indexOf(c) >= 0; });
      if (!ok) msg = bad.length ? (t.fb[bad[0]] || 'Ein Teilchen passt noch nicht.') : 'Ein Teilchen fehlt noch.';
    }
  } else if (t.type === 'number') {
    var x = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.'));
    if (isNaN(x)) msg = 'Gib eine Zahl ein.';
    else {
      ok = Math.abs(x - t.answer) <= t.tol;
      if (!ok) { msg = 'Rechne noch einmal nach.'; t.wrong.forEach(function(w){ if (w[0](x)) msg = w[1]; }); }
    }
  } else if (t.type === 'htap') {
    v = v || [];
    var hs = MOL[t.mol].hs, sel = hs.filter(function(h){ return v.indexOf(h.id) >= 0; });
    var falsch = sel.filter(function(h){ return !t.want(h); }), soll = hs.filter(t.want);
    ok = !falsch.length && (t.any ? sel.length > 0 : sel.length === soll.length);
    if (!ok) msg = falsch.length ? t.wrong : t.miss;
  }
  s.ok = ok; s.fb = ok ? '' : msg; s.n = (s.n || 0) + 1;
  save();
}

function taskClick(e){

/* Kette aus n C-Atomen, optional mit Methylgruppe an C2. h.c ist das C-Atom des H-Atoms (0 = Methylgruppe). */
function kette(n, zweig, nummern){
  var UC = 74, UH = 58, x0 = 90, y0 = zweig ? 206 : 86, a = [], b = [], hs = [];
  function hAt(c, x, y, cx, cy){ hs.push({id:'h' + hs.length, c:c, x:x, y:y}); b.push([cx, cy, x, y]); }
  for (var i = 1; i <= n; i++) {
    var x = x0 + (i - 1) * UC;
    a.push({t:'C', x:x, y:y0, n:i});
    if (i > 1) b.push([x - UC, y0, x, y0]);
    if (i === 1) hAt(i, x - UH, y0, x, y0);
    if (i === n) hAt(i, x + UH, y0, x, y0);
    if (!(zweig && i === 2)) hAt(i, x, y0 - UH, x, y0);
    hAt(i, x, y0 + UH, x, y0);
  }
  if (zweig) {
    var bx = x0 + UC, by = y0 - 118;
    a.push({t:'C', x:bx, y:by, n:0});
    b.push([bx, y0, bx, by]);
    hAt(0, bx - UH, by, bx, by); hAt(0, bx + UH, by, bx, by); hAt(0, bx, by - UH, bx, by);
  }
  return {atoms:a, bonds:b, hs:hs, w:x0 * 2 + (n - 1) * UC, h:y0 + UH + (nummern ? 76 : 44), num:nummern, y0:y0};
}

/* ---------- Simulation: Teilchen gegen den Berg ---------- */
function bergSim(root){
  var cv = root.querySelector('canvas'), ctx = cv.getContext('2d'), W = 600, H = 300;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var runBtn = root.querySelector('[data-sim="run"]'), msg = root.querySelector('.sim-msg'), cnt = root.querySelectorAll('.counter');
  var BASE = 238, PX = 52, MAX = 300;      // PX: Höhe je Energieeinheit, gleicher Maßstab für beide Berge
  var PAN = [{x:10, w:284, bar:3.4, name:'Weg 1'}, {x:306, w:284, bar:1.4, name:'Weg 2'}];
  var parts, tries, over, clock, running = false, raf = 0, last = 0;
  function g(u){ return Math.exp(-Math.pow((u - .5) / .16, 2)); }
  function yOf(p, u){ return BASE - p.bar * PX * g(u); }
  function reset(){ parts = []; tries = [0, 0]; over = [0, 0]; clock = 0; msg.hidden = true; setRun(false); upd(); draw(); }
  function upd(){ PAN.forEach(function(p, i){ cnt[i].textContent = p.name + ': ' + over[i] + ' von ' + tries[i] + ' Teilchen kommen über den Berg'; }); }
  function setRun(on){ running = on; runBtn.textContent = on ? 'Pause' : (tries[0] >= MAX ? 'Neu starten' : (tries[0] ? 'Weiter' : 'Start')); if (on) { last = 0; raf = requestAnimationFrame(loop); } else cancelAnimationFrame(raf); }
  function spawn(i){ tries[i]++; parts.push({p:i, u:0, dir:1, e:-Math.log(1 - Math.random()), spd:.42 + Math.random() * .2, st:0}); }
  function step(dt){
    clock += dt;
    while (clock > .085 && tries[0] < MAX) { clock -= .085; spawn(0); spawn(1); upd(); }
    parts.forEach(function(q){
      var p = PAN[q.p];
      q.u += q.dir * q.spd * dt;
      if (q.dir > 0 && q.u < .5 && g(q.u) * p.bar >= q.e) { q.dir = -1; q.st = 2; }       // Energie reicht nicht, das Teilchen rollt zurück
      if (q.dir > 0 && q.u >= .5 && q.st === 0) q.st = 1;
      if (q.st === 1 && q.u >= 1) { over[q.p]++; q.gone = true; upd(); }
      if (q.u <= 0 && q.dir < 0) q.gone = true;
    });
    parts = parts.filter(function(q){ return !q.gone; });
    if (tries[0] >= MAX && !parts.length) { setRun(false); msg.hidden = false; msg.textContent = 'Durchlauf beendet. Vergleiche die beiden Zähler.'; }
  }
  function draw(){
    var ink = css('--ink'), mut = css('--muted'), line = css('--line'), route = css('--route');
    ctx.clearRect(0, 0, W, H);
    PAN.forEach(function(p){
      ctx.beginPath(); ctx.moveTo(p.x, BASE);
      for (var k = 0; k <= 60; k++) { var u = k / 60; ctx.lineTo(p.x + u * p.w, yOf(p, u)); }
      ctx.lineTo(p.x + p.w, BASE + 40); ctx.lineTo(p.x, BASE + 40); ctx.closePath();
      ctx.fillStyle = css('--ridge'); ctx.fill();
      ctx.beginPath();
      for (var j = 0; j <= 60; j++) { var v = j / 60; ctx[j ? 'lineTo' : 'moveTo'](p.x + v * p.w, yOf(p, v)); }
      ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.fillStyle = ink; ctx.font = '700 15px ' + css('--f-body'); ctx.fillText(p.name, p.x + 8, 22);
    });
    parts.forEach(function(q){
      var p = PAN[q.p];
      ctx.beginPath(); ctx.arc(p.x + q.u * p.w, yOf(p, q.u) - 6, 4.2, 0, 6.2832);
      ctx.fillStyle = q.st === 1 ? route : (q.st === 2 ? line : mut); ctx.fill();
    });
  }
  function loop(ts){ if (!running) return; var dt = last ? Math.min((ts - last) / 1000, .05) : 0; last = ts; step(dt); draw(); if (running) raf = requestAnimationFrame(loop); }
  root.addEventListener('click', function(e){
    var b = e.target.closest('[data-sim]'); if (!b) return;
    if (b.dataset.sim === 'run') { if (tries[0] >= MAX) reset(); setRun(!running); }
    else if (b.dataset.sim === 'reset') reset();
  });
  reset();
  sims.push(function(){ setRun(false); });
}

  return '<div class="sim" data-berg="1"><canvas width="600" height="300" aria-label="Simulation: Teilchen laufen gegen zwei unterschiedlich hohe Berge"></canvas>' +

function renderSheet(){

    '<div class="sh-title">' + badge(st).replace('<span class="tick">' + ICON.check + '</span>', '') + '<div><div class="eyebrow">' + st.where + '</div><h2 id="shTitle">' + st.title + '</h2></div></div>' +
    '<div class="chips"><span class="chip">' + st.time + '</span><span class="chip">' + st.social + '</span></div></header>';
  var main = b.single ? '<div class="sheet-body single"><div class="col">' + b.L + '</div></div>' :
    '<div class="sheet-body"><div class="col"><h3>Material</h3>' + b.L + '</div><div class="col"><h3>Aufgaben</h3>' + b.R + '</div></div>';
  stopSims();

}
var KASTEN = {s1:'Kasten 1 (Statistik gegen Messung)', s2:'Kasten 2 (Erklärkette, beide Teile)', s3:'Kasten 3 (Antwort und Transfer)'};

function updateFoot(){
  var f = document.getElementById('foot'); if (!f) return;
  var id = cur, isDone = !!S.done[id], ok = ready(id), fin = canFinish(id);
  var hint;
  if (isDone) hint = 'Diese Station habt ihr abgeschlossen.';
  else if (fin) hint = 'Alles erledigt. Schließt die Station ab.';
  else if (ok) hint = 'Übertragt jetzt euer Ergebnis auf das Ergebnisblatt und hakt es ab.';
  else if (id === 's2') hint = !S.paar ? 'Wählt zuerst euer Paar.' : (!okAll(ownIds()) ? 'Löst zuerst alle Aufgaben von Teil ' + S.paar + '.' : 'Jetzt der Austausch: Löse die zwei Aufgaben zum anderen Teil.');

  else hint = 'Löst alle Aufgaben dieser Station.';
  var tr = KASTEN[id] ? checkItem(S.trans[id], 'Ergebnis übertragen: ' + KASTEN[id] + ' auf dem Ergebnisblatt', 'trans', id) : '';

function openStation(id){
  if (!ST[id]) return;
  cur = id;

  if (id === 's2' && S.paar && !S.tab) S.tab = S.paar;
  renderSheet();
  sheet.hidden = false; document.body.classList.add('noscroll'); sheet.scrollTop = 0;
  var c = sheet.querySelector('[data-a="close"]'); if (c) c.focus({preventScroll:true});
}
function closeSheet(){
  stopSims(); sheet.hidden = true; document.body.classList.remove('noscroll'); cur = null; renderMap();
}

sheet.addEventListener('click', function(e){
  if (taskClick(e)) return;
  var a = e.target.closest('[data-a]'); if (!a) return;
  var act = a.dataset.a, k = a.dataset.k;
  if (act === 'close') return closeSheet();
  if (act === 'goto') return openStation(k);
  if (act === 'trans') { S.trans[cur] = !S.trans[cur]; save(); updateFoot(); return; }
  if (act === 'finish') {
    if (canFinish(cur)) { var fin = cur; S.done[cur] = true; save(); closeSheet();
      if (fin !== 'ziel') toast('Geschafft! Sobald eure Gruppe so weit ist, kommt der Zeit-Manager nach vorne und hakt die Station auf der Fortschrittstafel ab.'); }
    return;
  }
  if (act === 'alkyl') { ALK = +k; document.getElementById('alkBox').innerHTML = alkylInner(); return; }
  if (act === 'rolle') { S.rolle = k; }
  else if (act === 'these') { S[a.dataset.w][a.dataset.t] = a.dataset.v; }
  else if (act === 'paar') { S.paar = k; S.tab = k; }
  else if (act === 'paar-reset') { S.paar = ''; S.tab = ''; }
  else if (act === 'tab') { S.tab = k; }
  else if (act === 'tab3') { S.tab3 = k; }
  else if (act === 'krit') { S.krit[k] = !S.krit[k]; }
  else if (act === 'muster') { S.muster = !S.muster; }
  else if (act === 'ins') {
    var ta = document.getElementById('leitTa'); if (!ta) return;
    var w = a.dataset.w, p0 = ta.selectionStart || ta.value.length, p1 = ta.selectionEnd || p0;
    var before = ta.value.slice(0, p0), sp = before && !/\s$/.test(before) ? ' ' : '';
    ta.value = before + sp + w + ta.value.slice(p1);
    ta.focus(); var pos = (before + sp + w).length; ta.setSelectionRange(pos, pos);
    leitInput(ta); return;
  } else return;
  save();
  var y = sheet.scrollTop; renderSheet(); sheet.scrollTop = y;
});
function leitInput(ta){
  S.text.leit = ta.value; save();
  var long = ta.value.trim().length >= 60;

  if (lc) lc.hidden = !long; if (lh) lh.hidden = long;

}
sheet.addEventListener('input', function(e){

sheet.addEventListener('keydown', function(e){

  } else if (kind === 'sitzung') {
    t = 'Sitzung auf diesem iPad';
    h = '<p>Auf diesem iPad ist schon eine Sitzung gespeichert.</p><div class="actions"><button type="button" class="btn primary small" data-a="pop-close">Das ist meine Sitzung</button><button type="button" class="btn small" data-a="reset-yes">Neue Sitzung starten</button></div>';
  } else if (kind === 'ergebnisse') {
    t = 'Meine Ergebnisse';
    var tipsUsed = Object.keys(S.tips).reduce(function(n, k){ return n + (S.tips[k] || 0); }, 0);
    var solved = Object.keys(S.tasks).filter(function(k){ return S.tasks[k].ok; }).length;
    h = '<div class="res-sec"><h3>Stationen</h3><ul class="steps">' + ORDER.concat(['p1']).map(function(id){
        return '<li><button type="button" data-open="' + id + '"><span class="mini' + (S.done[id] ? ' done' : '') + '">' + (ST[id].icon === 'flag' ? 'Z' : (ST[id].icon === 'camp' ? 'S' : ST[id].nr)) + '</span><span>' + ST[id].title + '</span>' + (S.done[id] ? '<span class="pill ok">erledigt</span>' : '<span class="pill">offen</span>') + '</button></li>'; }).join('') + '</ul></div>' +
      '<div class="res-sec"><h3>Selbstständigkeit</h3><p>' + solved + ' Aufgaben gelöst, ' + tipsUsed + (tipsUsed === 1 ? ' Tipp' : ' Tipps') + ' genutzt' + (S.paar ? ', Expertenpaar ' + S.paar : '') + (S.rolle ? ', Rolle: ' + esc(S.rolle) : '') + '</p></div>' +
      '<div class="res-sec"><h3>Unsere Antwort auf die Leitfrage</h3>' + (S.text.leit ? '<div class="answer">' + esc(S.text.leit) + '</div>' : '<p class="cap">Noch keine Antwort. Sie entsteht an Station 3.</p>') + '</div>' +
      '<div class="res-sec"><h3>Thesen-Check</h3><div class="tblwrap"><table class="tbl"><tr><th>These</th><th>vorher</th><th>nachher</th></tr>' + THESEN.map(function(x, i){
        function w(v){ return v ? (v === 'ja' ? 'stimmt' : 'stimmt nicht') : '–'; }
        return '<tr><td>' + (i + 1) + ' ' + esc(x.text) + '</td><td>' + w(S.vor[x.id]) + '</td><td>' + w(S.nach[x.id]) + '</td></tr>'; }).join('') + '</table></div></div>' +
      '<div class="res-sec" id="resetBox"><h3>Neu anfangen</h3><p class="cap">Löscht alle Eingaben auf diesem iPad, z. B. vor der nächsten Gruppe.</p><button type="button" class="btn small danger" data-a="reset-ask">Alles zurücksetzen</button></div>';
  }
  document.getElementById('popTitle').textContent = t;
  document.getElementById('popBody').innerHTML = h;
  pop.hidden = false;
  pop.querySelector('[data-a="pop-close"]').focus({preventScroll:true});
}
pop.addEventListener('click', function(e){
  if (e.target === pop) { pop.hidden = true; return; }
  var o = e.target.closest('[data-open]');
  if (o) { pop.hidden = true; openStation(o.dataset.open); return; }
  var a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'pop-close') pop.hidden = true;
  else if (a.dataset.a === 'reset-ask') {
    document.getElementById('resetBox').innerHTML = '<h3>Wirklich alles löschen?</h3><p class="cap">Alle Antworten, Häkchen und Thesen auf diesem iPad gehen verloren.</p><div class="actions"><button type="button" class="btn small danger" data-a="reset-yes">Ja, alles löschen</button><button type="button" class="btn small" data-a="reset-no">Abbrechen</button></div>';
  } else if (a.dataset.a === 'reset-yes') {
    S = fresh(); save(); pop.hidden = true; if (cur) closeSheet(); renderMap();
  } else if (a.dataset.a === 'reset-no') openPop('ergebnisse');
});

document.addEventListener('click', function(e){
  if (e.target.closest('#sheet') || e.target.closest('#pop')) return;
  var p = e.target.closest('[data-pop]'); if (p) return openPop(p.dataset.pop);
  var o = e.target.closest('[data-open]'); if (o) return openStation(o.dataset.open);
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (!pop.hidden) pop.hidden = true; else if (!sheet.hidden) closeSheet();
});

window.addEventListener('hashchange', function(){
  if (location.hash !== '#neu') return;
  S = fresh(); save();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (cur) closeSheet(); pop.hidden = true; renderMap();
});
renderMap();
if (Object.keys(S.done).length || S.rolle || Object.keys(S.vor).length) openPop('sitzung');
})();
</script>
</body>
</html>
